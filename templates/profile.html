{% extends "base.html" %}{% block title %}My Profile{% endblock %}{% block content %}<div class="pagehead"><div><span class="eyebrow">YOUR INFORMATION</span><h1>Build your career profile</h1><p>Separate multiple skills and interests with commas.</p></div></div><form class="panel formgrid" method="post"><label>Education<input name="education" value="{{ profile.education if profile else '' }}" placeholder="e.g. B.Sc. Computer Science"></label><label>Experience<select name="experience">{% for x in ['Beginner','Fresher','0-2 years','3-5 years','5+ years'] %}<option {% if profile and profile.experience==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label class="wide">Skills<textarea name="skills" rows="3" placeholder="Python, SQL, HTML, Communication">{{ profile.skills if profile else '' }}</textarea></label><label class="wide">Career interests<textarea name="interests" rows="2" placeholder="Software development, data analysis">{{ profile.interests if profile else '' }}</textarea></label><div class="wide"><button class="btn primary">Save profile</button> <a class="btn pale" href="{{ url_for('resume_skills') }}">Extract skills from TXT resume</a></div></form>{% endblock %}
